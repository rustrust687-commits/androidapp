<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<title>Трекер Тренировок</title>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js">
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js">
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100dvh;display:flex;flex-direction:column}
input,button,select{font-family:inherit;font-size:16px}
input{outline:none}
::placeholder{color:#444}

/* AUTH SCREENS */
#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
#authScreen h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#7C6FFF,#00D4AA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#authScreen p{color:#666;margin-bottom:32px;font-size:14px}
.auth-box{width:100%;max-width:360px;background:#141414;border-radius:16px;padding:24px;border:1px solid #2a2a2a}
.auth-box label{color:#aaa;font-size:13px;display:block;margin-bottom:6px;margin-top:16px}
.auth-box label:first-child{margin-top:0}
.auth-box input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:14px;color:#fff;font-size:16px}
.auth-box input:focus{border-color:#7C6FFF}
.btn-auth{width:100%;background:linear-gradient(135deg,#7C6FFF,#6B5CE7);border:none;border-radius:10px;padding:14px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:20px}
.btn-auth:disabled{opacity:.5}
.auth-switch{text-align:center;margin-top:14px;color:#666;font-size:14px}
.auth-switch a{color:#7C6FFF;cursor:pointer;text-decoration:none}
.auth-error{color:#ff4757;font-size:13px;margin-top:8px;display:none}

/* APP */
#app{display:none;flex-direction:column;min-height:100dvh}
header{background:#0a0a0a;padding:16px 20px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
header h2{font-size:18px;font-weight:600}
header button{background:none;border:none;color:#7C6FFF;cursor:pointer;font-size:14px;padding:6px 12px;border-radius:8px}
header button:hover{background:#1a1a1a}
main{flex:1;overflow-y:auto;padding:16px}
.tab-content{display:none}
.tab-content.active{display:block}

/* NAV */
nav{display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding:6px 0 env(safe-area-inset-bottom,8px) 0}
nav button{flex:1;background:none;border:none;color:#444;font-size:12px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:color .2s}
nav button span{font-size:20px}
nav button.active{color:#7C6FFF}

/* FORMS */
.form-group{margin-bottom:16px}
.form-group label{color:#888;font-size:13px;display:block;margin-bottom:6px;font-weight:500}
.form-group input{width:100%;background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:14px;color:#fff;font-size:16px;transition:border-color .2s}
.form-group input:focus{border-color:#7C6FFF}
.form-group .hint{color:#555;font-size:12px;margin-top:4px}
.btn{width:100%;background:linear-gradient(135deg,#7C6FFF,#6B5CE7);border:none;border-radius:10px;padding:15px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5}
.btn-secondary{background:#2a2a2a;margin-top:8px}

/* CARDS */
.card{background:#141414;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #2a2a2a;display:flex;justify-content:space-between;align-items:center}
.card-body{flex:1;cursor:pointer}
.card-exercise{font-size:16px;font-weight:600;margin-bottom:4px}
.card-detail{color:#888;font-size:13px;margin-top:2px}
.card-actions{display:flex;gap:10px;margin-left:10px}
.card-actions button{background:none;border:none;color:#7C6FFF;cursor:pointer;font-size:18px;padding:4px}
.card-actions .btn-del{color:#ff4757}

/* TOP BAR */
.top-bar{display:flex;gap:8px;margin-bottom:14px}
.top-bar .filter{flex:1;display:flex;align-items:center;gap:6px;background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:10px;color:#888;font-size:13px;cursor:pointer}
.top-bar .export{display:flex;align-items:center;gap:6px;background:#7C6FFF;border:none;border-radius:10px;padding:10px 14px;color:#fff;font-size:13px;cursor:pointer;font-weight:500}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;padding:24px}
.modal-overlay.show{display:flex}
.modal{background:#141414;border-radius:16px;padding:20px;width:100%;max-width:380px;max-height:70vh;overflow-y:auto;border:1px solid #2a2a2a}
.modal h3{font-size:17px;font-weight:600;margin-bottom:14px}
.modal-item{padding:12px;border-radius:10px;cursor:pointer;color:#888;font-size:15px;margin-bottom:4px}
.modal-item:hover,.modal-item.active{background:#1e1e1e;color:#fff}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:#555}
.empty span{font-size:48px;display:block;margin-bottom:12px}

/* CHART */
.chart-wrap{margin-top:16px;padding:12px;background:#141414;border-radius:12px;border:1px solid #2a2a2a}

/* RESPONSIVE */
@media(min-width:600px){body{max-width:480px;margin:0 auto;border-left:1px solid #1a1a1a;border-right:1px solid #1a1a1a}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <h1>Трекер</h1>
  <p>Тренировок</p>
  <div class="auth-box">
    <div id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
      <label>Пароль</label>
      <input type="password" id="loginPass" placeholder="минимум 6 символов" autocomplete="current-password">
      <div class="auth-error" id="authError"></div>
      <button class="btn-auth" id="authBtn">Войти</button>
      <div class="auth-switch">
        <span id="authToggleText">Нет аккаунта? <a id="authToggle">Зарегистрироваться</a></span>
      </div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h2 id="pageTitle">Добавить</h2>
    <button id="logoutBtn">Выйти</button>
  </header>
  <main id="mainContent">

    <!-- TAB: ADD -->
    <div class="tab-content active" id="tabAdd">
      <div class="form-group">
        <label>Упражнение</label>
        <input type="text" id="inputExercise" placeholder="Например: Жим лёжа">
      </div>
      <div class="form-group">
        <label>Вес (кг)</label>
        <input type="number" id="inputWeight" placeholder="0" step="0.5" min="0">
      </div>
      <div class="form-group">
        <label>Повторения</label>
        <input type="number" id="inputReps" placeholder="0" min="0">
      </div>
      <div class="form-group">
        <label>Дата и время</label>
        <input type="datetime-local" id="inputDatetime">
        <div class="hint">Формат: ГГГГ-ММ-ДДTЧЧ:ММ</div>
      </div>
      <button class="btn" id="saveBtn">Сохранить</button>
      <button class="btn btn-secondary" id="saveCancelBtn" style="display:none">Отмена</button>
    </div>

    <!-- TAB: HISTORY -->
    <div class="tab-content" id="tabHistory">
      <div class="top-bar">
        <div class="filter" id="filterBtn">
          <span>▼</span> <span id="filterLabel">Все упражнения</span>
        </div>
        <button class="export" id="exportBtn">
          <span>↗</span> Экспорт для ИИ
        </button>
      </div>
      <div id="historyList"></div>
    </div>

    <!-- TAB: PROGRESS -->
    <div class="tab-content" id="tabProgress">
      <div class="form-group">
        <label>Упражнение</label>
        <select id="progressSelect" style="width:100%;background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:14px;color:#fff;font-size:16px;appearance:none">
          <option value="">Выберите упражнение</option>
        </select>
      </div>
      <div id="progressChart" class="chart-wrap" style="display:none">
        <canvas id="chartCanvas"></canvas>
      </div>
      <div id="progressEmpty" class="empty">
        <span>📊</span>
        <p>Выберите упражнение для просмотра прогресса</p>
      </div>
    </div>

  </main>

  <nav id="tabNav">
    <button class="active" data-tab="tabAdd"><span>+</span> Добавить</button>
    <button data-tab="tabHistory"><span>☰</span> История</button>
    <button data-tab="tabProgress"><span>📈</span> Прогресс</button>
  </nav>
</div>

<!-- FILTER MODAL -->
<div class="modal-overlay" id="filterModal">
  <div class="modal">
    <h3>Выберите упражнение</h3>
    <div id="filterList"></div>
  </div>
</div>

<script>
// ===== FIREBASE CONFIG =====
const firebaseConfig = {
  apiKey: "AIzaSyDOLjG64QLM_JEdJIm_fBlvdO8-2onfnAE",
  authDomain: "train-eg.firebaseapp.com",
  projectId: "train-eg",
  storageBucket: "train-eg.firebasestorage.app",
  messagingSenderId: "660986897667",
  appId: "1:660986897667:web:90fac579aacf7196deb536",
  measurementId: "G-W2MEVQP2D6"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ===== STATE =====
let currentUser = null;
let workouts = [];
let editId = null;
let filterExercise = null;
let chartInstance = null;

// ===== DOM REFS =====
const authScreen = document.getElementById('authScreen');
const app = document.getElementById('app');
const loginEmail = document.getElementById('loginEmail');
const loginPass = document.getElementById('loginPass');
const authBtn = document.getElementById('authBtn');
const authError = document.getElementById('authError');
const authToggle = document.getElementById('authToggle');
const authToggleText = document.getElementById('authToggleText');
const logoutBtn = document.getElementById('logoutBtn');
const pageTitle = document.getElementById('pageTitle');
const tabNav = document.getElementById('tabNav');

let isRegister = false;

// ===== AUTH =====
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    authScreen.style.display = 'none';
    app.style.display = 'flex';
    loadWorkouts();
  } else {
    currentUser = null;
    authScreen.style.display = 'flex';
    app.style.display = 'none';
  }
});

authBtn.onclick = async () => {
  const email = loginEmail.value.trim();
  const pass = loginPass.value.trim();
  if (!email || !pass) { showAuthError('Заполните все поля'); return; }
  if (pass.length < 6) { showAuthError('Пароль минимум 6 символов'); return; }
  authBtn.disabled = true;
  authBtn.textContent = 'Загрузка...';
  authError.style.display = 'none';
  try {
    if (isRegister) {
      await auth.createUserWithEmailAndPassword(email, pass);
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  } catch (e) {
    const msgs = {
      'user-not-found': 'Пользователь не найден',
      'wrong-password': 'Неверный пароль',
      'email-already-in-use': 'Email уже используется',
      'invalid-email': 'Неверный формат email',
      'too-many-requests': 'Слишком много попыток, попробуйте позже',
    };
    showAuthError(msgs[e.code] || e.code);
  } finally {
    authBtn.disabled = false;
    authBtn.textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
  }
};

authToggle.onclick = () => {
  isRegister = !isRegister;
  authBtn.textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
  authToggleText.innerHTML = isRegister
    ? 'Уже есть аккаунт? <a id="authToggle">Войти</a>'
    : 'Нет аккаунта? <a id="authToggle">Зарегистрироваться</a>';
  document.getElementById('authToggle').onclick = authToggle.onclick;
};

function showAuthError(msg) {
  authError.textContent = msg;
  authError.style.display = 'block';
}

logoutBtn.onclick = () => auth.signOut();

loginEmail.onkeydown = e => { if (e.key === 'Enter') loginPass.focus(); };
loginPass.onkeydown = e => { if (e.key === 'Enter') authBtn.click(); };

// ===== TABS =====
tabNav.onclick = e => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
  document.getElementById(btn.dataset.tab).classList.add('active');
  btn.classList.add('active');
  const titles = { tabAdd: 'Добавить', tabHistory: 'История', tabProgress: 'Прогресс' };
  pageTitle.textContent = titles[btn.dataset.tab] || '';
  if (btn.dataset.tab === 'tabHistory') loadWorkouts();
  if (btn.dataset.tab === 'tabProgress') updateProgressSelect();
};

// ===== CRUD =====
const COL = 'workouts';

function nowLocal() {
  const d = new Date();
  const offset = d.getTimezoneOffset();
  const local = new Date(d.getTime() - offset * 60000);
  return local.toISOString().slice(0, 16);
}

document.getElementById('inputDatetime').value = nowLocal();

document.getElementById('saveBtn').onclick = async () => {
  const exercise = document.getElementById('inputExercise').value.trim();
  const weight = parseFloat(document.getElementById('inputWeight').value);
  const reps = parseInt(document.getElementById('inputReps').value);
  const datetime = document.getElementById('inputDatetime').value;

  if (!exercise) { alert('Введите название упражнения'); return; }
  if (isNaN(weight)) { alert('Введите вес'); return; }
  if (isNaN(reps)) { alert('Введите количество повторений'); return; }
  if (!datetime) { alert('Введите дату'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Сохранение...';

  try {
    const data = { exercise, weight, reps, datetime, uid: currentUser.uid };
    if (editId) {
      await db.collection(COL).doc(editId).update(data);
    } else {
      await db.collection(COL).add(data);
    }
    clearForm();
    switchTab('tabHistory');
  } catch (e) {
    alert('Ошибка сохранения: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Сохранить';
  }
};

document.getElementById('saveCancelBtn').onclick = () => {
  clearForm();
  switchTab('tabHistory');
};

function clearForm() {
  document.getElementById('inputExercise').value = '';
  document.getElementById('inputWeight').value = '';
  document.getElementById('inputReps').value = '';
  document.getElementById('inputDatetime').value = nowLocal();
  editId = null;
  document.getElementById('saveCancelBtn').style.display = 'none';
}

function editWorkout(w) {
  document.getElementById('inputExercise').value = w.exercise;
  document.getElementById('inputWeight').value = w.weight;
  document.getElementById('inputReps').value = w.reps;
  document.getElementById('inputDatetime').value = (w.datetime || '').slice(0, 16);
  editId = w.id;
  document.getElementById('saveCancelBtn').style.display = 'block';
  switchTab('tabAdd');
}

async function deleteWorkout(id) {
  if (!confirm('Удалить тренировку?')) return;
  try {
    await db.collection(COL).doc(id).delete();
    loadWorkouts();
  } catch (e) {
    alert('Ошибка удаления');
  }
}

async function loadWorkouts() {
  try {
    const q = db.collection(COL)
      .where('uid', '==', currentUser.uid)
      .orderBy('datetime', 'desc');
    const snap = await q.get();
    workouts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderHistory();
    updateProgressSelect();
  } catch (e) {
    console.error('Load error:', e);
  }
}

// ===== HISTORY =====
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' })
    + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const filtered = filterExercise
    ? workouts.filter(w => w.exercise === filterExercise)
    : workouts;

  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><span>🏋️</span><p>Тренировок пока нет</p></div>';
    document.getElementById('filterLabel').textContent = filterExercise || 'Все упражнения';
    return;
  }

  document.getElementById('filterLabel').textContent = filterExercise || 'Все упражнения';

  list.innerHTML = filtered.map(w => `
    <div class="card">
      <div class="card-body" onclick="editWorkout(${JSON.stringify(w).replace(/"/g,'&quot;')})">
        <div class="card-exercise">${escHtml(w.exercise)}</div>
        <div class="card-detail">${fmtDate(w.datetime)}</div>
        <div class="card-detail">${w.weight} кг × ${w.reps} повторений</div>
      </div>
      <div class="card-actions">
        <button onclick="editWorkout(${JSON.stringify(w).replace(/"/g,'&quot;')})">✎</button>
        <button class="btn-del" onclick="deleteWorkout('${w.id}')">✕</button>
      </div>
    </div>
  `).join('');
}

function escHtml(s) { return String(s).replace(/[&<>"]/g, function(m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

// ===== FILTER =====
document.getElementById('filterBtn').onclick = () => {
  const list = document.getElementById('filterList');
  const exercises = [...new Set(workouts.map(w => w.exercise))].sort();
  list.innerHTML = `
    <div class="modal-item ${!filterExercise ? 'active' : ''}"
      onclick="setFilter(null);closeModal('filterModal')">Все</div>
    ${exercises.map(ex => `
      <div class="modal-item ${filterExercise === ex ? 'active' : ''}"
        onclick="setFilter('${escHtml(ex)}');closeModal('filterModal')">${escHtml(ex)}</div>
    `).join('')}
  `;
  document.getElementById('filterModal').classList.add('show');
};

function setFilter(ex) {
  filterExercise = ex;
  renderHistory();
  document.getElementById('filterModal').classList.remove('show');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.onclick = e => { if (e.target === el) el.classList.remove('show'); };
});

// ===== EXPORT =====
document.getElementById('exportBtn').onclick = async () => {
  const now = new Date();
  const cut = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);
  const recent = workouts.filter(w => new Date(w.datetime) >= cut);
  if (recent.length === 0) { alert('Нет данных за последние 30 дней'); return; }

  const lines = recent.reverse().map(w =>
    `Дата: ${fmtDate(w.datetime)}, Упражнение: ${w.exercise}, Вес: ${w.weight}кг, Повторы: ${w.reps}`
  );
  const text = lines.join('\n');

  if (navigator.share) {
    try {
      const file = new File([text], 'training_export.txt', { type: 'text/plain' });
      await navigator.share({ files: [file], title: 'Экспорт тренировок' });
      return;
    } catch {}
  }

  try {
    await navigator.clipboard.writeText(text);
    alert('Скопировано в буфер обмена');
  } catch {
    prompt('Скопируйте текст:', text);
  }
};

// ===== PROGRESS =====
function updateProgressSelect() {
  const sel = document.getElementById('progressSelect');
  const exercises = [...new Set(workouts.map(w => w.exercise))].sort();
  const current = sel.value;
  sel.innerHTML = '<option value="">Выберите упражнение</option>'
    + exercises.map(ex => `<option value="${escHtml(ex)}">${escHtml(ex)}</option>`).join('');
  sel.value = current;
}

document.getElementById('progressSelect').onchange = function() {
  drawChart(this.value);
};

function drawChart(exercise) {
  const chartWrap = document.getElementById('progressChart');
  const empty = document.getElementById('progressEmpty');
  const canvas = document.getElementById('chartCanvas');

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  if (!exercise) {
    chartWrap.style.display = 'none';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = 'Выберите упражнение';
    return;
  }

  const data = workouts
    .filter(w => w.exercise === exercise)
    .sort((a, b) => new Date(a.datetime) - new Date(b.datetime))
    .reduce((acc, w) => {
      const day = w.datetime.slice(0, 10);
      const last = acc[acc.length - 1];
      if (last && last.day === day) {
        last.weight = Math.max(last.weight, w.weight);
      } else {
        acc.push({ day, weight: w.weight, label: w.datetime.slice(5, 10) });
      }
      return acc;
    }, []);

  if (data.length < 2) {
    chartWrap.style.display = 'none';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = 'Нужно минимум 2 тренировки для графика';
    return;
  }

  empty.style.display = 'none';
  chartWrap.style.display = 'block';

  const ctx = canvas.getContext('2d');
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [{
        label: 'Вес (кг)',
        data: data.map(d => d.weight),
        borderColor: '#7C6FFF',
        backgroundColor: 'rgba(124,111,255,0.1)',
        borderWidth: 2,
        pointBackgroundColor: '#7C6FFF',
        pointBorderColor: '#0a0a0a',
        pointRadius: 5,
        fill: true,
        tension: 0.4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#888' } } },
      scales: {
        x: { ticks: { color: '#888' }, grid: { color: '#2a2a2a' } },
        y: { ticks: { color: '#888', callback: v => v + 'кг' }, grid: { color: '#2a2a2a' } }
      }
    }
  });
}

// ===== HELPERS =====
function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const btn = document.querySelector(`#tabNav button[data-tab="${id}"]`);
  if (btn) btn.classList.add('active');
  const titles = { tabAdd: 'Добавить', tabHistory: 'История', tabProgress: 'Прогресс' };
  pageTitle.textContent = titles[id] || '';
}

// ===== RESIZE HANDLER FOR CHART =====
window.addEventListener('resize', () => {
  if (chartInstance) chartInstance.resize();
});
</script>
