<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<title>Трекер Тренировок</title>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js">
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js">
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100dvh;display:flex;flex-direction:column}
input,button,select,textarea{font-family:inherit;font-size:16px}
input,textarea{outline:none}
::placeholder{color:#444}

/* AUTH */
#authScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:24px}
#authScreen h1{font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#7C6FFF,#00D4AA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#authScreen p{color:#666;margin-bottom:32px;font-size:14px}
.auth-box{width:100%;max-width:360px;background:#141414;border-radius:16px;padding:24px;border:1px solid #2a2a2a}
.auth-box label{color:#aaa;font-size:13px;display:block;margin-bottom:6px;margin-top:16px}
.auth-box label:first-child{margin-top:0}
.auth-box input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:14px;color:#fff;font-size:16px}
.auth-box input:focus{border-color:#7C6FFF}
.btn-auth{width:100%;background:linear-gradient(135deg,#7C6FFF,#6B5CE7);border:none;border-radius:10px;padding:14px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:20px}
.btn-auth:disabled{opacity:.5}
.auth-switch{text-align:center;margin-top:14px;color:#666;font-size:14px}
.auth-switch a{color:#7C6FFF;cursor:pointer;text-decoration:none}
.auth-error{color:#ff4757;font-size:13px;margin-top:8px;display:none}

/* APP */
#app{display:none;flex-direction:column;min-height:100dvh}
header{background:#0a0a0a;padding:16px 20px;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
header h2{font-size:18px;font-weight:600}
header button{background:none;border:none;color:#7C6FFF;cursor:pointer;font-size:14px;padding:6px 12px;border-radius:8px}
header button:hover{background:#1a1a1a}
main{flex:1;overflow-y:auto;padding:16px}
.tab-content{display:none}
.tab-content.active{display:block}

/* NAV */
nav{display:flex;background:#0a0a0a;border-top:1px solid #1a1a1a;padding:6px 0 env(safe-area-inset-bottom,8px) 0}
nav button{flex:1;background:none;border:none;color:#444;font-size:11px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
nav button span{font-size:20px}
nav button.active{color:#7C6FFF}

/* FORMS */
.form-group{margin-bottom:14px}
.form-group label{color:#888;font-size:13px;display:block;margin-bottom:6px;font-weight:500}
.form-group input,.form-group select{width:100%;background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:14px;color:#fff;font-size:16px;transition:border-color .2s}
.form-group input:focus{border-color:#7C6FFF}
.form-group .hint{color:#555;font-size:12px;margin-top:4px}
.btn{width:100%;background:linear-gradient(135deg,#7C6FFF,#6B5CE7);border:none;border-radius:10px;padding:15px;color:#fff;font-weight:600;font-size:16px;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5}
.btn-secondary{background:#2a2a2a}
.btn-danger{background:linear-gradient(135deg,#ff4757,#c0392b)}

/* CARDS */
.card{background:#141414;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #2a2a2a}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-title{font-size:16px;font-weight:600}
.card-sub{color:#888;font-size:13px;margin-top:2px}
.card-body{padding:4px 0}
.card-actions{display:flex;gap:8px}
.card-actions button{background:none;border:none;color:#7C6FFF;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}
.card-actions button:hover{background:#1e1e1e}
.card-actions .del{color:#ff4757}

/* EXERCISE ROW IN ADD SCREEN */
.ex-row{display:flex;gap:8px;align-items:center;background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:10px;margin-bottom:8px}
.ex-row .ex-name{flex:1.5;font-size:15px;color:#fff;font-weight:500}
.ex-row .ex-field{flex:1}
.ex-row .ex-field input{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:10px;color:#fff;font-size:14px;text-align:center}
.ex-row .ex-field input:focus{border-color:#7C6FFF}
.ex-row .ex-unit{color:#666;font-size:12px;width:24px;text-align:center}

/* MODAL */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;justify-content:center;align-items:center;padding:24px}
.modal-overlay.show{display:flex}
.modal{background:#141414;border-radius:16px;padding:20px;width:100%;max-width:400px;max-height:80vh;overflow-y:auto;border:1px solid #2a2a2a}
.modal h3{font-size:17px;font-weight:600;margin-bottom:14px}
.modal-item{padding:12px;border-radius:10px;cursor:pointer;color:#888;font-size:15px;margin-bottom:4px}
.modal-item:hover,.modal-item.active{background:#1e1e1e;color:#fff}

/* CHIP */
.chip{display:inline-block;background:#1e1e1e;color:#aaa;font-size:12px;padding:4px 10px;border-radius:16px;margin:2px}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:#555}
.empty span{font-size:48px;display:block;margin-bottom:12px}

/* SESSION IN HISTORY */
.session-date{font-size:14px;color:#7C6FFF;font-weight:600;margin:16px 0 8px 4px}
.session-card .ex-entry{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1a1a1a;font-size:14px}
.session-card .ex-entry:last-child{border:none}
.session-card .ex-entry .name{color:#ccc}
.session-card .ex-entry .vals{color:#888}

/* CHART */
.chart-wrap{margin-top:16px;padding:12px;background:#141414;border-radius:12px;border:1px solid #2a2a2a}

/* RESPONSIVE */
@media(min-width:600px){body{max-width:480px;margin:0 auto;border-left:1px solid #1a1a1a;border-right:1px solid #1a1a1a}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authScreen">
  <h1>Трекер</h1>
  <p>Тренировок</p>
  <div class="auth-box">
    <div id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
      <label>Пароль</label>
      <input type="password" id="loginPass" placeholder="минимум 6 символов" autocomplete="current-password">
      <div class="auth-error" id="authError"></div>
      <button class="btn-auth" id="authBtn">Войти</button>
      <div class="auth-switch"><span id="authToggleText">Нет аккаунта? <a id="authToggle">Зарегистрироваться</a></span></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h2 id="pageTitle">Добавить</h2>
    <button id="logoutBtn">Выйти</button>
  </header>
  <main id="mainContent">

    <!-- TAB: ADD SESSION -->
    <div class="tab-content active" id="tabAdd">
      <div class="form-group">
        <label>День тренировки</label>
        <select id="sessionDaySelect"><option value="">-- Выберите --</option></select>
      </div>
      <div id="sessionExercises"></div>
      <button class="btn" id="saveSessionBtn">Сохранить тренировку</button>
    </div>

    <!-- TAB: PROGRAM -->
    <div class="tab-content" id="tabProgram">
      <div id="dayList"></div>
      <button class="btn" id="addDayBtn">+ Создать день тренировки</button>
    </div>

    <!-- TAB: HISTORY -->
    <div class="tab-content" id="tabHistory">
      <div class="form-group">
        <label>Фильтр</label>
        <select id="historyFilter"><option value="">Все дни</option></select>
      </div>
      <button class="btn btn-secondary" id="exportBtn" style="margin-top:0;margin-bottom:12px">↗ Экспорт для ИИ</button>
      <div id="historyList"></div>
    </div>

    <!-- TAB: PROGRESS -->
    <div class="tab-content" id="tabProgress">
      <div class="form-group">
        <label>Упражнение</label>
        <select id="progressSelect" style="appearance:none"><option value="">Выберите</option></select>
      </div>
      <div id="progressChart" class="chart-wrap" style="display:none"><canvas id="chartCanvas"></canvas></div>
      <div id="progressEmpty" class="empty"><span>📊</span><p>Выберите упражнение</p></div>
    </div>

  </main>
  <nav id="tabNav">
    <button class="active" data-tab="tabAdd"><span>+</span> Добавить</button>
    <button data-tab="tabProgram"><span>📋</span> Программа</button>
    <button data-tab="tabHistory"><span>☰</span> История</button>
    <button data-tab="tabProgress"><span>📈</span> Прогресс</button>
  </nav>
</div>

<!-- MODAL: CREATE/EDIT DAY -->
<div class="modal-overlay" id="dayModal">
  <div class="modal">
    <h3 id="dayModalTitle">Новый день тренировки</h3>
    <div class="form-group">
      <label>Название дня</label>
      <input type="text" id="dayNameInput" placeholder="Например: Грудь + Трицепс">
    </div>
    <div class="form-group">
      <label>Упражнения (по одному на строку)</label>
      <textarea id="dayExercisesInput" rows="6" style="width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:10px;padding:12px;color:#fff;font-size:15px;resize:vertical" placeholder="Жим лёжа&#10;Разводка гантелей&#10;Французский жим"></textarea>
    </div>
    <button class="btn" id="saveDayBtn">Сохранить</button>
    <button class="btn btn-secondary" onclick="closeModal('dayModal')">Отмена</button>
  </div>
</div>

<!-- MODAL: VIEW SESSION -->
<div class="modal-overlay" id="sessionModal">
  <div class="modal">
    <h3 id="sessionModalTitle">Тренировка</h3>
    <div id="sessionModalBody"></div>
    <button class="btn btn-danger" id="deleteSessionBtn" style="margin-top:16px">Удалить</button>
    <button class="btn btn-secondary" onclick="closeModal('sessionModal')">Закрыть</button>
  </div>
</div>

<script>
// ===== FIREBASE =====
firebase.initializeApp({
  apiKey: "AIzaSyDOLjG64QLM_JEdJIm_fBlvdO8-2onfnAE",
  authDomain: "train-eg.firebaseapp.com",
  projectId: "train-eg",
  storageBucket: "train-eg.firebasestorage.app",
  messagingSenderId: "660986897667",
  appId: "1:660986897667:web:90fac579aacf7196deb536",
  measurementId: "G-W2MEVQP2D6"
});
const auth = firebase.auth();
const db = firebase.firestore();

// ===== STATE =====
let currentUser = null;
let days = [];
let sessions = [];
let editingDayId = null;
let viewingSessionId = null;
let chartInstance = null;

// ===== AUTH =====
auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    loadAll();
  } else {
    currentUser = null;
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
  }
});

document.getElementById('authBtn').onclick = async () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  if (!email || !pass) { showAuthError('Заполните все поля'); return; }
  if (pass.length < 6) { showAuthError('Пароль минимум 6 символов'); return; }
  const isRegister = document.getElementById('authBtn').textContent === 'Зарегистрироваться';
  document.getElementById('authBtn').disabled = true;
  document.getElementById('authBtn').textContent = 'Загрузка...';
  document.getElementById('authError').style.display = 'none';
  try {
    if (isRegister) await auth.createUserWithEmailAndPassword(email, pass);
    else await auth.signInWithEmailAndPassword(email, pass);
  } catch (e) {
    const msgs = {
      'user-not-found':'Пользователь не найден','wrong-password':'Неверный пароль',
      'email-already-in-use':'Email уже используется','invalid-email':'Неверный формат email',
      'too-many-requests':'Слишком много попыток, попробуйте позже'
    };
    showAuthError(msgs[e.code] || e.code);
  } finally {
    document.getElementById('authBtn').disabled = false;
    document.getElementById('authBtn').textContent = isRegister ? 'Зарегистрироваться' : 'Войти';
  }
};

document.getElementById('authToggle').onclick = () => {
  const isR = document.getElementById('authBtn').textContent === 'Регистрация';
  document.getElementById('authBtn').textContent = isR ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('authToggleText').innerHTML = isR
    ? 'Нет аккаунта? <a id="authToggle">Зарегистрироваться</a>'
    : 'Уже есть аккаунт? <a id="authToggle">Войти</a>';
  document.getElementById('authToggle').onclick = document.getElementById('authToggle').onclick;
};

function showAuthError(msg) {
  document.getElementById('authError').textContent = msg;
  document.getElementById('authError').style.display = 'block';
}

document.getElementById('logoutBtn').onclick = () => auth.signOut();

// ===== LOAD ALL =====
async function loadAll() {
  await Promise.all([loadDays(), loadSessions()]);
}

// ===== TABS =====
document.getElementById('tabNav').onclick = e => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
  document.getElementById(btn.dataset.tab).classList.add('active');
  btn.classList.add('active');
  const titles = { tabAdd:'Добавить', tabProgram:'Программа', tabHistory:'История', tabProgress:'Прогресс' };
  document.getElementById('pageTitle').textContent = titles[btn.dataset.tab] || '';
  if (btn.dataset.tab === 'tabAdd') populateDaySelect();
  if (btn.dataset.tab === 'tabHistory') renderHistory();
  if (btn.dataset.tab === 'tabProgress') populateProgressSelect();
};

function switchTab(id) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#tabNav button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  const tb = document.querySelector(`#tabNav button[data-tab="${id}"]`);
  if (tb) tb.classList.add('active');
  const titles = { tabAdd:'Добавить', tabProgram:'Программа', tabHistory:'История', tabProgress:'Прогресс' };
  document.getElementById('pageTitle').textContent = titles[id] || '';
  if (id === 'tabAdd') populateDaySelect();
  if (id === 'tabHistory') renderHistory();
  if (id === 'tabProgress') populateProgressSelect();
}

// ===== DAYS CRUD =====
async function loadDays() {
  if (!currentUser) return;
  const q = db.collection('days').where('uid','==',currentUser.uid).orderBy('createdAt');
  const snap = await q.get();
  days = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderDays();
  populateDaySelect();
  populateHistoryFilter();
  populateProgressSelect();
}

function renderDays() {
  const el = document.getElementById('dayList');
  if (days.length === 0) {
    el.innerHTML = '<div class="empty"><span>📋</span><p>Нет дней тренировок. Создайте первый!</p></div>';
    return;
  }
  el.innerHTML = days.map(d => `
    <div class="card">
      <div class="card-header">
        <div class="card-title">${esc(d.name)}</div>
        <div class="card-actions">
          <button onclick="editDay('${d.id}')">✎</button>
          <button class="del" onclick="deleteDay('${d.id}')">✕</button>
        </div>
      </div>
      <div class="card-body">
        ${(d.exercises||[]).map(e => `<span class="chip">${esc(e)}</span>`).join('')}
        ${(!d.exercises||d.exercises.length===0) ? '<span style="color:#555;font-size:13px">Нет упражнений</span>' : ''}
      </div>
    </div>
  `).join('');
}

document.getElementById('addDayBtn').onclick = () => {
  editingDayId = null;
  document.getElementById('dayModalTitle').textContent = 'Новый день тренировки';
  document.getElementById('dayNameInput').value = '';
  document.getElementById('dayExercisesInput').value = '';
  document.getElementById('dayModal').classList.add('show');
};

document.getElementById('saveDayBtn').onclick = async () => {
  const name = document.getElementById('dayNameInput').value.trim();
  const exText = document.getElementById('dayExercisesInput').value.trim();
  if (!name) { alert('Введите название дня'); return; }
  const exercises = exText.split('\n').map(s => s.trim()).filter(Boolean);
  if (exercises.length === 0) { alert('Добавьте хотя бы одно упражнение'); return; }

  const btn = document.getElementById('saveDayBtn');
  btn.disabled = true; btn.textContent = 'Сохранение...';
  try {
    const data = { name, exercises, uid: currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    if (editingDayId) {
      await db.collection('days').doc(editingDayId).update({ name, exercises });
    } else {
      await db.collection('days').add(data);
    }
    closeModal('dayModal');
    await loadAll();
  } catch (e) { alert('Ошибка: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Сохранить'; }
};

function editDay(id) {
  const d = days.find(x => x.id === id);
  if (!d) return;
  editingDayId = id;
  document.getElementById('dayModalTitle').textContent = 'Редактировать день';
  document.getElementById('dayNameInput').value = d.name;
  document.getElementById('dayExercisesInput').value = (d.exercises||[]).join('\n');
  document.getElementById('dayModal').classList.add('show');
}

async function deleteDay(id) {
  if (!confirm('Удалить этот день тренировки?')) return;
  try {
    await db.collection('days').doc(id).delete();
    await loadAll();
  } catch (e) { alert('Ошибка: ' + e.message); }
}

// ===== ADD SESSION =====
function populateDaySelect() {
  const sel = document.getElementById('sessionDaySelect');
  sel.innerHTML = '<option value="">-- Выберите день --</option>' +
    days.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  sel.onchange = () => renderSessionExercises(sel.value);
}

function renderSessionExercises(dayId) {
  const container = document.getElementById('sessionExercises');
  const day = days.find(d => d.id === dayId);
  if (!day || !day.exercises || day.exercises.length === 0) {
    container.innerHTML = '<div style="color:#555;text-align:center;padding:20px">Выберите день с упражнениями</div>';
    return;
  }
  container.innerHTML = day.exercises.map((ex, i) => `
    <div class="ex-row">
      <div class="ex-name">${esc(ex)}</div>
      <div class="ex-field"><input type="number" step="0.5" min="0" placeholder="вес" id="sw_${i}" inputmode="decimal"></div>
      <div class="ex-unit">кг</div>
      <div class="ex-field"><input type="number" min="0" placeholder="повт" id="sr_${i}" inputmode="numeric"></div>
      <div class="ex-unit">раз</div>
    </div>
  `).join('');
  container._dayId = dayId;
  container._exercises = day.exercises;
}

document.getElementById('saveSessionBtn').onclick = async () => {
  const dayId = document.getElementById('sessionDaySelect').value;
  if (!dayId) { alert('Выберите день тренировки'); return; }
  const day = days.find(d => d.id === dayId);
  if (!day) return;

  const date = new Date().toISOString();
  const exercises = [];
  for (let i = 0; i < day.exercises.length; i++) {
    const w = parseFloat(document.getElementById(`sw_${i}`)?.value);
    const r = parseInt(document.getElementById(`sr_${i}`)?.value);
    if (!isNaN(w) || !isNaN(r)) {
      exercises.push({ name: day.exercises[i], weight: isNaN(w) ? 0 : w, reps: isNaN(r) ? 0 : r });
    }
  }
  if (exercises.length === 0) { alert('Введите хотя бы одно значение'); return; }

  const btn = document.getElementById('saveSessionBtn');
  btn.disabled = true; btn.textContent = 'Сохранение...';
  try {
    await db.collection('sessions').add({
      uid: currentUser.uid,
      dayId: day.id,
      dayName: day.name,
      date,
      exercises,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // Clear form
    document.getElementById('sessionDaySelect').value = '';
    document.getElementById('sessionExercises').innerHTML = '<div style="color:#555;text-align:center;padding:20px">Выберите день с упражнениями</div>';
    await loadSessions();
    switchTab('tabHistory');
  } catch (e) { alert('Ошибка: ' + e.message); }
  finally { btn.disabled = false; btn.textContent = 'Сохранить тренировку'; }
};

// ===== SESSIONS =====
async function loadSessions() {
  if (!currentUser) return;
  try {
    const q = db.collection('sessions').where('uid','==',currentUser.uid).orderBy('date','desc');
    const snap = await q.get();
    sessions = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.error(e); }
}

function populateHistoryFilter() {
  const sel = document.getElementById('historyFilter');
  const dayNames = [...new Set(sessions.map(s => s.dayName))];
  sel.innerHTML = '<option value="">Все дни</option>' +
    dayNames.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
  sel.onchange = () => renderHistory();
}

function renderHistory() {
  const filter = document.getElementById('historyFilter').value;
  const filtered = filter ? sessions.filter(s => s.dayName === filter) : sessions;

  const list = document.getElementById('historyList');
  if (filtered.length === 0) {
    list.innerHTML = '<div class="empty"><span>🏋️</span><p>Тренировок пока нет</p></div>';
    return;
  }

  // Group by date
  const groups = {};
  filtered.forEach(s => {
    const key = s.date.slice(0,10);
    if (!groups[key]) groups[key] = [];
    groups[key].push(s);
  });

  list.innerHTML = Object.entries(groups).map(([date, sess]) => `
    <div class="session-date">${fmtDate(date)}</div>
    ${sess.map(s => `
      <div class="card session-card" onclick="viewSession('${s.id}')">
        <div class="card-header">
          <div class="card-title">${esc(s.dayName)}</div>
          <div style="color:#888;font-size:13px">${fmtTime(s.date)}</div>
        </div>
        <div class="card-body">
          ${(s.exercises||[]).map(e =>
            `<div class="ex-entry"><span class="name">${esc(e.name)}</span><span class="vals">${e.weight}кг × ${e.reps}</span></div>`
          ).join('')}
        </div>
      </div>
    `).join('')}
  `).join('');
}

function viewSession(id) {
  const s = sessions.find(x => x.id === id);
  if (!s) return;
  viewingSessionId = id;
  document.getElementById('sessionModalTitle').textContent = s.dayName + ' — ' + fmtDate(s.date);
  document.getElementById('sessionModalBody').innerHTML = `
    <div style="color:#888;font-size:13px;margin-bottom:10px">${fmtDateFull(s.date)}</div>
    ${(s.exercises||[]).map(e => `
      <div class="ex-entry"><span class="name">${esc(e.name)}</span><span class="vals">${e.weight}кг × ${e.reps}</span></div>
    `).join('')}
  `;
  document.getElementById('sessionModal').classList.add('show');
}

document.getElementById('deleteSessionBtn').onclick = async () => {
  if (!viewingSessionId) return;
  if (!confirm('Удалить эту тренировку?')) return;
  try {
    await db.collection('sessions').doc(viewingSessionId).delete();
    closeModal('sessionModal');
    await loadSessions();
    renderHistory();
  } catch (e) { alert('Ошибка: ' + e.message); }
};

// ===== EXPORT =====
document.getElementById('exportBtn').onclick = async () => {
  const now = new Date();
  const cut = new Date(now.getTime() - 30*24*60*60*1000);
  const recent = sessions.filter(s => new Date(s.date) >= cut);
  if (recent.length === 0) { alert('Нет данных за 30 дней'); return; }

  const lines = recent.reverse().flatMap(s =>
    (s.exercises||[]).map(e =>
      `Дата: ${fmtDate(s.date)}, День: ${s.dayName}, Упражнение: ${e.name}, Вес: ${e.weight}кг, Повторы: ${e.reps}`
    )
  );

  try {
    await navigator.clipboard.writeText(lines.join('\n'));
    alert('Скопировано в буфер обмена');
  } catch {
    prompt('Скопируйте текст:', lines.join('\n'));
  }
};

// ===== PROGRESS =====
function populateProgressSelect() {
  const allEx = [...new Set(sessions.flatMap(s => (s.exercises||[]).map(e => e.name)))].sort();
  const sel = document.getElementById('progressSelect');
  sel.innerHTML = '<option value="">Выберите упражнение</option>' +
    allEx.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
}

document.getElementById('progressSelect').onchange = function() {
  drawChart(this.value);
};

function drawChart(exercise) {
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const wrap = document.getElementById('progressChart');
  const empty = document.getElementById('progressEmpty');
  if (!exercise) { wrap.style.display='none'; empty.style.display='block'; empty.querySelector('p').textContent='Выберите упражнение'; return; }

  const data = sessions.flatMap(s =>
    (s.exercises||[]).filter(e => e.name === exercise).map(e => ({ date: s.date.slice(0,10), weight: e.weight, label: s.date.slice(5,10) }))
  ).sort((a,b) => a.date.localeCompare(b.date))
  .reduce((acc, item) => {
    const last = acc[acc.length-1];
    if (last && last.date === item.date) { last.weight = Math.max(last.weight, item.weight); }
    else acc.push(item);
    return acc;
  }, []);

  if (data.length < 2) {
    wrap.style.display='none'; empty.style.display='block';
    empty.querySelector('p').textContent = data.length === 1 ? 'Нужно минимум 2 тренировки для графика' : 'Нет данных';
    return;
  }

  empty.style.display='none'; wrap.style.display='block';
  chartInstance = new Chart(document.getElementById('chartCanvas'), {
    type: 'line',
    data: {
      labels: data.map(d => d.label),
      datasets: [{
        label: 'Вес (кг)', data: data.map(d => d.weight),
        borderColor: '#7C6FFF', backgroundColor: 'rgba(124,111,255,0.1)',
        borderWidth: 2, pointBackgroundColor: '#7C6FFF', pointBorderColor: '#0a0a0a',
        pointRadius: 5, fill: true, tension: 0.4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#888' } } },
      scales: {
        x: { ticks: { color: '#888' }, grid: { color: '#2a2a2a' } },
        y: { ticks: { color: '#888', callback: v => v+'кг' }, grid: { color: '#2a2a2a' } }
      }
    }
  });
}

// ===== HELPERS =====
function esc(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }
document.querySelectorAll('.modal-overlay').forEach(el => { el.onclick = e => { if (e.target === el) el.classList.remove('show'); }; });

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  const days = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}) + ' ' + days[d.getDay()];
}
function fmtTime(s) {
  if (!s) return '';
  return new Date(s).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function fmtDateFull(s) {
  if (!s) return '';
  return new Date(s).toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
</script>
